    <script>
        let map;
        let userMarker;
        let donorMarkers = [];
        let infoWindows = [];
        let mapReady = false;
        
        // User's actual location - STAYS FIXED
        let userLocation = {
            lat: 23.77341,
            lng: 90.42523,
            name: 'Your Location'
        };

        function showDebug(msg) {
            const el = document.getElementById('map-debug');
            if (!el) { console.log('[Map Debug]', msg); return; }
            el.style.display = 'block';
            el.textContent = msg;
            console.log('[Map Debug]', msg);
        }
        
        // Initialize Map
        function initMap() {
            try {
                const mapContainer = document.getElementById('map');
                if (!mapContainer) {
                    console.error('❌ Map container not found');
                    showDebug('❌ Map container not found');
                    return;
                }
                
                console.log('✅ Creating map at:', userLocation.lat, userLocation.lng);
                map = L.map('map').setView([userLocation.lat, userLocation.lng], 13);
                
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(map);
                
                console.log('✅ Map tile layer added');
                
                // Add user marker at user's location
                updateUserMarker({ lat: userLocation.lat, lng: userLocation.lng });
                
                // Ensure map is properly sized
                setTimeout(() => {
                    if (map) {
                        map.invalidateSize();
                        mapReady = true;
                        showDebug(`✅ Map ready. Your location: ${userLocation.lat.toFixed(4)}, ${userLocation.lng.toFixed(4)}`);
                        console.log('✅ Map initialized and ready');
                    }
                }, 300);
            } catch (e) {
                console.error('❌ Map initialization error:', e);
                showDebug('❌ Map init error: ' + e.message);
            }
        }
        
        // Auto-request user location on page load
        function autoRequestUserLocation() {
            if (!navigator.geolocation) {
                console.warn('Geolocation not supported by browser');
                showDebug('⚠️ Geolocation not supported');
                return;
            }
            
            showDebug('📍 Requesting your location...');
            console.log('Requesting geolocation...');
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    
                    console.log(`✅ Location obtained: ${lat}, ${lng} (accuracy: ${accuracy}m)`);
                    
                    // Update global state with actual GPS location
                    currentLocationState = {
                        lat: lat,
                        lng: lng,
                        region: null,
                        name: `Your Location (${lat.toFixed(4)}, ${lng.toFixed(4)})`
                    };
                    
                    // Update input fields with actual coordinates
                    document.getElementById('userLat').value = lat.toFixed(4);
                    document.getElementById('userLng').value = lng.toFixed(4);
                    
                    // Update current location display
                    const currentLoc = document.getElementById('currentLocation');
                    currentLoc.textContent = `📍 Your Location: ${lat.toFixed(4)}, ${lng.toFixed(4)} (±${Math.round(accuracy)}m)`;
                    currentLoc.classList.add('active');
                    
                    // Update user marker on map
                    updateUserMarker({ lat, lng });
                    
                    // Clear region selection since using GPS
                    document.getElementById('regionSelect').value = '';
                    document.getElementById('coordinatesInput').style.display = 'block';
                    
                    showDebug(`✅ Your location: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
                    console.log('Current location state:', currentLocationState);
                },
                (error) => {
                    console.error('Geolocation error:', error.message);
                    let errorMsg = '';
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = 'Location permission denied. Please enable location access in your browser settings.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = 'Location information is unavailable.';
                            break;
                        case error.TIMEOUT:
                            errorMsg = 'Location request timed out. Please try again.';
                            break;
                        default:
                            errorMsg = error.message;
                    }
                    
                    console.warn('Location error:', errorMsg);
                    showDebug(`⚠️ Location error: ${errorMsg}`);
                    
                    // Don't show alert - just show in debug, user can manually select location
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }
        
        // Update user's location marker (BLUE marker - stays fixed at user location)
        function updateUserMarker(location) {
            if (!map) {
                console.error('❌ Map not initialized yet');
                return;
            }
            
            try {
                // Store user location
                userLocation.lat = location.lat;
                userLocation.lng = location.lng;
                
                if (userMarker) {
                    userMarker.setLatLng([location.lat, location.lng]);
                    console.log(`✅ User marker updated: ${location.lat.toFixed(4)}, ${location.lng.toFixed(4)}`);
                } else {
                    userMarker = L.circleMarker([location.lat, location.lng], {
                        radius: 12,
                        color: '#1976D2',
                        weight: 3,
                        fillColor: '#2196F3',
                        fillOpacity: 0.9,
                        dashArray: '5, 5'
                    }).addTo(map).bindPopup('📍 Your Location').bindTooltip('Your Location', { permanent: true });
                    console.log(`✅ User marker created: ${location.lat.toFixed(4)}, ${location.lng.toFixed(4)}`);
                }
                
                // Center map on user location
                map.setView([location.lat, location.lng], 14);
                
                // Force map to redraw
                setTimeout(() => {
                    if (map) {
                        map.invalidateSize();
                    }
                }, 100);
            } catch (e) {
                console.error('❌ Error updating user marker:', e);
            }
        }
        
        // Clear existing donor markers
        function clearDonorMarkers() {
            donorMarkers.forEach(marker => marker.remove());
            infoWindows.forEach(iw => iw.remove && iw.remove());
            donorMarkers = [];
            infoWindows = [];
        }
        
        // Add donor markers to map
        function addDonorMarkers(donors) {
            clearDonorMarkers();
            
            if (donors.length === 0) {
                return;
            }
            
            donors.forEach((donor, index) => {
                let latitude, longitude;
                
                // Handle both GeoJSON and simple lat/lng formats
                if (donor.coordinates && donor.coordinates.coordinates && Array.isArray(donor.coordinates.coordinates)) {
                    // GeoJSON format: [longitude, latitude]
                    longitude = donor.coordinates.coordinates[0];
                    latitude = donor.coordinates.coordinates[1];
                } else if (donor.latitude && donor.longitude) {
                    // Simple format
                    latitude = donor.latitude;
                    longitude = donor.longitude;
                } else {
                    return; // Skip donors without valid coordinates
                }
                
                const position = {
                    lat: latitude,
                    lng: longitude
                };
                
                // Color code by blood group
                const bloodColor = getBloodGroupColor(donor.bloodGroup);
                
                const marker = L.circleMarker([position.lat, position.lng], {
                    radius: 10,
                    color: '#fff',
                    weight: 2,
                    fillColor: bloodColor,
                    fillOpacity: 0.8
                }).addTo(map);

                const infoContent = `
                    <div class="info-popup">
                        <h4>${donor.name}</h4>
                        <p><strong>Blood Group:</strong> ${donor.bloodGroup}</p>
                        <p><strong>Distance:</strong> ${donor.distanceKm} km</p>
                        <p><strong>Status:</strong> ${donor.availabilityStatus || 'Available'}</p>
                        <p><strong>Phone:</strong> ${donor.phone || 'Not provided'}</p>
                        <p><strong>Location:</strong> ${donor.location || 'Not specified'}</p>
                        ${donor.lastDonationDate ? `<p><strong>Last Donation:</strong> ${new Date(donor.lastDonationDate).toLocaleDateString()}</p>` : ''}
                    </div>
                `;

                marker.bindPopup(infoContent);
                donorMarkers.push(marker);
            });
        }
        
        // Get color based on blood group
        function getBloodGroupColor(bloodGroup) {
            const colors = {
                'O+': '#FF6B6B',
                'O-': '#FF8C92',
                'A+': '#FF4444',
                'A-': '#FF5555',
                'B+': '#E91E63',
                'B-': '#C2185B',
                'AB+': '#9C27B0',
                'AB-': '#7B1FA2'
            };
            return colors[bloodGroup] || '#e91e63';
        }
        
        // Search nearby donors
        async function searchNearestDonors() {
            const region = document.getElementById('regionSelect').value;
            const lat = parseFloat(document.getElementById('userLat').value);
            const lng = parseFloat(document.getElementById('userLng').value);
            const radius = parseFloat(document.getElementById('searchRadius').value) || 5;
            const bloodGroup = document.getElementById('bloodGroup').value;
            
            console.log('Search params:', { region, lat, lng, radius, bloodGroup });
            
            // Validate inputs
            if (!region && (!lat || !lng || isNaN(lat) || isNaN(lng))) {
                alert('Please select a region or enter valid coordinates to search');
                return;
            }
            
            const donorsList = document.getElementById('donorsList');
            donorsList.innerHTML = '<div class="loading">⏳ Searching for donors...</div>';
            
            try {
                let url = `/api/donors/nearest?radius=${radius}`;
                let searchLocationName = '';
                
                if (region) {
                    url += `&region=${encodeURIComponent(region)}`;
                    searchLocationName = region.charAt(0).toUpperCase() + region.slice(1);
                    console.log(`Searching donors in region: ${region}`);
                } else {
                    url += `&lat=${lat}&lng=${lng}`;
                    searchLocationName = `(${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                    console.log(`Searching donors at coordinates: ${lat}, ${lng}`);
                }
                if (bloodGroup) {
                    url += `&bloodGroup=${encodeURIComponent(bloodGroup)}`;
                }
                
                showDebug(`🔍 Searching for donors in ${searchLocationName}...`);
                console.log('Full API URL:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('API Response:', data);
                
                if (!data.success) {
                    donorsList.innerHTML = `<div class="no-donors-msg">❌ ${data.message}</div>`;
                    clearDonorMarkers();
                    showDebug(`Search failed: ${data.message}`);
                    return;
                }
                
                // DO NOT move user marker - keep it at its current location
                // Just add donor markers to the map
                addDonorMarkers(data.donors);
                
                // Update current location display to show what region is being searched
                const currentLoc = document.getElementById('currentLocation');
                currentLoc.textContent = `🔍 Searching in: ${searchLocationName} | Radius: ${radius}km | Found: ${data.donors.length} donors`;
                currentLoc.classList.add('active');
                
                showDebug(`✅ Found ${data.donors.length} donors in ${searchLocationName}`);
                
                // Display donors in sidebar
                if (data.donors.length === 0) {
                    donorsList.innerHTML = '<div class="no-donors-msg">No donors found in this area</div>';
                } else {
                    donorsList.innerHTML = data.donors.map((donor, index) => `
                        <div class="donor-card" onclick="highlightMarker(${index})">
                            <div class="donor-name">
                                <span>${donor.name}</span>
                                <span class="blood-badge">${donor.bloodGroup}</span>
                            </div>
                            <div class="donor-info">
                                📍 ${donor.location || 'Location not set'}
                            </div>
                            <div class="donor-info">
                                📞 ${donor.phone || 'Phone not provided'}
                            </div>
                            <div class="donor-info">
                                ⏰ ${donor.availabilityStatus || 'Available'}
                            </div>
                            <span class="distance-badge">🎯 ${donor.distanceKm} km away</span>
                            <div style="margin-top: 10px; display: flex; gap: 8px;">
                                <button class="btn-contact" onclick="contactDonor('${donor.phone}', '${donor.name}')">📞 Contact</button>
                                <button class="btn-request" onclick="requestBlood('${donor._id}', '${donor.name}')">📥 Request</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Search error:', error);
                donorsList.innerHTML = '<div class="no-donors-msg">❌ Error searching donors</div>';
                showDebug(`❌ Search error: ${error.message}`);
            }
        }
        
        // Highlight marker on donor card hover
        function highlightMarker(index) {
            if (donorMarkers[index]) {
                donorMarkers[index].openPopup();
            }
        }

        // Contact donor
        function contactDonor(phone, name) {
            if (!phone || phone === 'undefined') {
                alert('Donor phone number not available');
                return;
            }
            alert(`📞 Contact ${name} at: ${phone}\n\nPlease reach out to them directly for blood donation requests.`);
        }

        // Request blood from donor
        function requestBlood(donorId, donorName) {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');

            if (!token || user.role !== 'recipient') {
                alert('Please log in as a recipient to request blood');
                return;
            }

            // Redirect to requests page with donor info
            window.location.href = `requests.html?donor=${donorId}&name=${encodeURIComponent(donorName)}`;
        }

        // Logout function
        function logout(e) {
            if (e) e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // Update navbar with user info
        function updateNavbarUserInfo() {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            let user = null;
            
            try {
                user = userStr ? JSON.parse(userStr) : null;
            } catch (e) {
                user = null;
            }

            const userInfo = document.getElementById('userInfo');
            const userName = document.getElementById('userName');
            const userRole = document.getElementById('userRole');
            const userAvatar = document.getElementById('userAvatar');
            const logoutLink = document.getElementById('logoutLink');
            const guestLink = document.querySelector('.guest-link');

            if (token && user) {
                // User is logged in
                userInfo.style.display = 'flex';
                logoutLink.style.display = 'inline-block';
                if (guestLink) guestLink.style.display = 'none';

                // Set user info
                userName.textContent = user.name || user.email || 'User';
                userRole.textContent = user.role ? user.role.charAt(0).toUpperCase() + user.role.slice(1) : 'User';
                userAvatar.textContent = (user.name || user.email || 'U').charAt(0).toUpperCase();
            } else {
                // User is not logged in
                userInfo.style.display = 'none';
                logoutLink.style.display = 'none';
                if (guestLink) guestLink.style.display = 'inline-block';
            }
        }
        
        // Get user's current location
        function getUserLocation() {
            if (navigator.geolocation) {
                const btn = document.getElementById('locateBtn');
                btn.textContent = '⏳ Getting location...';
                btn.disabled = true;
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        document.getElementById('userLat').value = lat.toFixed(4);
                        document.getElementById('userLng').value = lng.toFixed(4);
                        
                        const currentLoc = document.getElementById('currentLocation');
                        currentLoc.textContent = `📍 Your location: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        currentLoc.classList.add('active');
                        
                        updateUserMarker({ lat, lng });
                        btn.textContent = '📍 My Location';
                        btn.disabled = false;
                    },
                    (error) => {
                        alert('Could not get your location: ' + error.message);
                        btn.textContent = '📍 My Location';
                        btn.disabled = false;
                    }
                );
            } else {
                alert('Geolocation is not supported by your browser');
            }
        }
        
        // Event listeners
        document.getElementById('searchBtn').addEventListener('click', searchNearestDonors);
        document.getElementById('locateBtn').addEventListener('click', getUserLocation);
        document.getElementById('userLat').addEventListener('keypress', (e) => e.key === 'Enter' && searchNearestDonors());
        document.getElementById('userLng').addEventListener('keypress', (e) => e.key === 'Enter' && searchNearestDonors());
        
        // Handle region selection - just for searching, don't move marker
        document.getElementById('regionSelect').addEventListener('change', (e) => {
            const coordinatesInput = document.getElementById('coordinatesInput');
            const region = e.target.value;
            
            if (region) {
                // Region selected - show coordinates input is hidden
                coordinatesInput.style.display = 'none';
                console.log(`Region selected for search: ${region}`);
            } else {
                // Manual entry, show coordinates input
                coordinatesInput.style.display = 'block';
            }
        });
        
        // Update user location when coordinates are manually changed
        document.getElementById('userLat').addEventListener('change', (e) => {
            const lat = parseFloat(e.target.value);
            const lng = parseFloat(document.getElementById('userLng').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                console.log(`✅ Updating user location to: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
                updateUserMarker({ lat, lng });
                document.getElementById('currentLocation').textContent = `📍 Your Location: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                document.getElementById('currentLocation').classList.add('active');
                showDebug(`✅ User location: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
            }
        });
        
        document.getElementById('userLng').addEventListener('change', (e) => {
            const lat = parseFloat(document.getElementById('userLat').value);
            const lng = parseFloat(e.target.value);
            if (!isNaN(lat) && !isNaN(lng)) {
                console.log(`✅ Updating user location to: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
                updateUserMarker({ lat, lng });
                document.getElementById('currentLocation').textContent = `📍 Your Location: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                document.getElementById('currentLocation').classList.add('active');
                showDebug(`✅ User location: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
            }
        });
        
        // Initialize on load
        window.addEventListener('load', () => {
            showDebug('Page loaded, initializing map...');
            if (typeof L === 'undefined') {
                showDebug('Leaflet not loaded yet, retrying...');
                setTimeout(() => {
                    if (typeof L === 'undefined') {
                        showDebug('ERROR: Leaflet failed to load!');
                        return;
                    }
                    try { 
                        initMap(); 
                        setTimeout(() => {
                            updateNavbarUserInfo(); 
                            initNavbarAuthState();
                        }, 200);
                    } catch (e) { 
                        showDebug('Init error: ' + e.message); 
                        console.error('Init error:', e);
                    }
                }, 500);
            } else {
                try { 
                    initMap(); 
                    setTimeout(() => {
                        updateNavbarUserInfo(); 
                        initNavbarAuthState();
                    }, 200);
                } catch (e) { 
                    showDebug('Init error: ' + e.message); 
                    console.error('Init error:', e);
                }
            }
            window.addEventListener('resize', () => {
                try { 
                    if (map) { 
                        map.invalidateSize();
                    } 
                } catch (e) {
                    console.warn('Resize error:', e);
                }
            });
        });
    </script>
</body>
</html>
